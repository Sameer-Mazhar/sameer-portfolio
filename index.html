    <div className="footer-callout reveal"><div><p className="section-number"><Icon name="fa-satellite-dish"/> NEXT CONNECTION</p><h2>Have an idea?<br/><span>Let's make it real.</span></h2><p className="muted">A thoughtful interface. A reliable backend. A product built to last.</p></div><a href={'mailto:'+EMAIL} className="btn primary">Start a conversation <Icon name="fa-arrow-up-right-from-square"/></a></div>

      <div className="footer-brand"><a href="#home" className="logo" aria-label="Sameer Mazhar home"><span>&lt;</span> SM <span>/&gt;</span></a><h3>Sameer Mazhar<span className="accent">.</span></h3><p className="label accent">Full Stack Developer</p><p className="muted">Building intuitive web experiences and intelligent systems, from the first idea to the final deploy.</p><div className="footer-socials"><a href={LINKEDIN} target="_blank" rel="noreferrer" aria-label="Sameer on LinkedIn"><i className="fa-brands fa-linkedin-in" aria-hidden="true"/></a><a href={'mailto:'+EMAIL} aria-label="Email Sameer"><Icon name="fa-envelope"/></a><a href="tel:+923091835466" aria-label="Call Sameer"><Icon name="fa-phone"/></a><a href="/resume.pdf" download="Sameer_Mazhar_Resume.pdf" aria-label="Download Sameer's CV"><Icon name="fa-file-arrow-down"/></a></div></div>

      <div><h3 className="footer-title"><Icon name="fa-terminal"/> What I build</h3><ul className="footer-list">{[['fa-laptop-code','Responsive websites'],['fa-server','Backend & REST APIs'],['fa-brain','AI-powered SaaS'],['fa-cart-shopping','eCommerce platforms'],['fa-database','Business dashboards']].map(([icon,label])=><li key={label}><a href="#projects"><Icon name={icon}/>{label}</a></li>)}</ul><a className="footer-resume" href="/resume.pdf" download="Sameer_Mazhar_Resume.pdf"><Icon name="fa-download"/> Download my CV</a></div>

function Hero(){return <section id="home" className="hero"><div className="wrap hero-layout"><div><div className="status label"><span className="dot"/> Available for full-time opportunities</div><p className="label muted mt-7">HELLO, WORLD. I'M</p><h1>Sameer<span className="glitch">Mazhar<span className="text-white">.</span></span></h1><div className="hero-role"><span className="accent">&gt; </span>Full Stack Developer<span className="cursor">_</span></div><p className="hero-copy muted">Turning complex problems into intuitive digital experiences. I build web applications, intelligent SaaS platforms, and the systems that power them.</p><div className="hero-actions"><a href="#projects" className="btn primary">Explore my work <Icon name="fa-arrow-right"/></a><a href="/resume.pdf" download="Sameer_Mazhar_Resume.pdf" className="btn secondary"><Icon name="fa-download"/> Download CV</a></div><div className="socials"><a href={LINKEDIN} target="_blank" rel="noreferrer" aria-label="LinkedIn"><i className="fa-brands fa-linkedin-in" aria-hidden="true"/></a><a href={'mailto:'+EMAIL} aria-label="Email Sameer"><Icon name="fa-envelope"/></a><a href="tel:+923091835466" aria-label="Call Sameer"><Icon name="fa-phone"/></a><span className="label muted">Sambrial, Pakistan <Icon name="fa-location-dot"/></span></div></div><div className="hud" aria-label="Developer system illustration"><div className="hud-top"><span>DEVELOPER_ID: SM-001</span><span className="accent">● SYSTEM ONLINE</span></div><div className="orb-frame"><div className="orb"><div className="orbit"/></div><span className="orb-code">&lt;/&gt;</span></div><span className="hud-tag">FULL STACK // HUMAN POWERED</span><div className="terminal"><div className="terminal-bar"><i/><i/><i/><span className="ml-3">sameer@workspace: ~</span></div><div className="terminal-body"><div><span className="accent">$</span> developer --status</div><div className="muted">› Python + React + a little ingenuity</div><div className="muted">› Building function About(){return <section id="about" className="section wrap reveal"><Heading number="01" kicker="THE PERSON BEHIND THE CODE" title="A developer." accent="A problem solver."/><div className="about-grid"><div><p className="muted">I'm Sameer, a Full Stack Developer based in Sambrial, Pakistan. My work connects polished interfaces with reliable backends — using Python, Flask, JavaScript, React and Firebase.</p><p className="muted mt-5">From retail systems to AI-powered SaaS, I enjoy taking a product from the first idea to deployment. I've led teams of 4–6 engineers and mentored junior developers along the way.</p><div className="mt-6 label accent"><Icon name="fa-graduation-cap"/> BS Information Technology</div><p className="muted text-xs mt-2">Virtual University of Pakistan · 2022–2026<br/></p></div><div className="stats">{[['2+','Years of experience','fa-calendar-check'],['25+','Concurrent projects','fa-layer-group'],['40%','Faster page loads','fa-gauge-high'],['4–6','Engineers led','fa-users']].map(([value,label,icon])=><div className="stat" key={label}><Icon name={icon} className="stat-icon"/><strong>{value}</strong><span>{label}</span></div>)}</div></div></section>;}

function ProjectModal({project,onClose}){const box=useRef(null);useEffect(()=>{const before=document.activeElement;box.current.focus();const old=document.body.style.overflow;document.body.style.overflow='hidden';function key(e){if(e.key==='Escape')onClose();if(e.key==='Tab'){const elements=box.current.querySelectorAll('button,a[href]'),first=elements[0],last=elements[elements.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===box.current)){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}document.addEventListener('keydown',key);return()=>{document.body.style.overflow=old;document.removeEventListener('keydown',key);before?.focus();};},[onClose]);return <div className="modal-backdrop" onClick={e=>{if(e.target===e.currentTarget)onClose();}}><div ref={box} tabIndex="-1" className="panel modal" role="dialog" aria-modal="true" aria-labelledby="project-title"><button className="modal-close" onClick={onClose} aria-label="Close project details"><Icon name="fa-xmark"/></button><p className="project-category">{project.category}</p><h3 id="project-title">{project.name}</h3><p className="muted mt-4">{project.description}</p><ul className="list-disc pl-5 mt-5">{project.details.map(detail=><li key={detail}>{detail}</li>)}</ul><div className="chips">{project.tags.map(tag=><span className="chip" key={tag}>{tag}</span>)}</div><p className="muted text-xs mt-6">Details are from my CV. Dashboard artwork is illustrative; public demo links were not supplied.</p><a href={'mailto:'+EMAIL+'?subject='+encodeURIComponent('Project enquiry: '+project.name)} className="btn mt-6">Discuss this project <Icon name="fa-arrow-right"/></a></div></div>;}

function Contact(){const [status,setStatus]=useState(''),[busy,setBusy]=useState(false);async function submit(e){e.preventDefault();const form=e.currentTarget,data=Object.fromEntries(new FormData(form));setBusy(true);setStatus('Saving your message…');try{const response=await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),result=await response.json();if(!response.ok)throw Error(result.error||'Unable to send.');setStatus(result.message||'Message saved.');form.reset();}catch(error){setStatus(error.message||'Connection failed. Please email me directly.');}finally{setBusy(false);}}return <section id="contact" className="section wrap reveal"><Heading number="05" kicker="OPEN A NEW CONNECTION" title="Let's build" accent="something great."/><div className="contact-grid"><div><p className="muted">Have a project in mind or a role on your team? I'd love to hear what you're working on.</p><a className="contact-link" href={'mailto:'+EMAIL}><Icon name="fa-envelope"/>{EMAIL}</a><a className="contact-link" href="tel:+923091835466"><Icon name="fa-phone"/>+92 309 183 5466</a><a className="contact-link" href={LINKEDIN} target="_blank" rel="noreferrer"><Icon name="fa-arrow-up-right-from-square"/>Connect on LinkedIn</a><div className="status label mt-8"><span className="dot"/> Open to full stack & backend roles</div></div><form className="panel" onSubmit={submit}><div className="label accent mb-6">&gt; START A CONVERSATION</div><div className="form-row"><div><label htmlFor="name"><Icon name="fa-user"/> YOUR NAME</label><input id="name" name="name" placeholder="Your name" autoComplete="name" required minLength="2" maxLength="100"/></div><div><label htmlFor="email"><Icon name="fa-envelope"/> EMAIL ADDRESS</label><input id="email" name="email" type="email" placeholder="you@example.com" autoComplete="email" required maxLength="254"/></div></div><label htmlFor="message"><Icon name="fa-message"/> YOUR MESSAGE</label><textarea id="message" name="message" placeholder="Tell me about your project or opportunity…" required minLength="10" maxLength="5000"/><div className="hidden" aria-hidden="true"><label htmlFor="website">Website</label><input id="website" name="website" tabIndex="-1" autoComplete="off"/></div><button className="btn primary mt-5 w-full" type="submit" disabled={busy}>{busy?'Saving…':'Send message'} <Icon name="fa-paper-plane"/></button><p className="muted text-xs mt-4"></p><p className="form-status accent" role="status" aria-live="polite">{status}</p></form></div></section>;}
function IndexPage(){useEffect(()=>{const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('visible');observer.unobserve(entry.target);}}),{threshold:.08});document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));return()=>observer.disconnect();},[]);return <><a className="skip" href="#main">Skip to content</a><Navbar/><main id="main"><Hero/><Marquee/><About/><Skills/><Projects/><Experience/><Contact/></main><Footer/></>;}
